# mrmr example configuration.
# Copy to mrmr.yaml and adjust. Secrets never live here: api_key_env names
# an environment variable that the runtime reads at request time.

server:
  addr: ":4242"

db:
  path: "mrmr.db"

# Deterministic checks before the model. All checks must pass; an event
# that fails any is recorded and ignored before interpretation. A field
# the event does not carry fails every check, so filter on fields your
# sources always send (source is always present).
filter:
  - field: source
    op: neq
    value: noise-bot

models:
  fast-local:
    provider: openai-compatible
    base_url: http://localhost:8000/v1
    api_key_env: MRMR_MODEL_API_KEY
    model: llama-3.1-8b-instruct

interpret:
  model: fast-local
  prompt: |
    You classify ambient events for a home runtime. Given an event as JSON,
    judge what it means and return a structured decision.

    Rules of thumb:
    - incident: something is broken or failing right now.
    - noise: routine chatter that never needs attention.
    - FYI: interesting but nothing to do.
    - actionable: something the user should consider doing.
    - importance is 0.0 to 1.0.
    - requires_action is true only when the user genuinely needs to act.
    - summary is one short sentence.

  schema:
    category:
      type: string
      enum: [incident, noise, FYI, actionable]
    importance:
      type: number
      minimum: 0
      maximum: 1
    requires_action:
      type: boolean
    confidence:
      type: number
      minimum: 0
      maximum: 1
    summary:
      type: string

# First match wins; unmatched events fall to `default`.
policy:
  - if:
      result.category: incident
      result.confidence: "> 0.85"
    then:
      notify:
        via: stdout
        message: "{{ .result.summary }}"

  # Bounded deterministic action (v0.1: http, emit):
  # then:
  #   action:
  #     type: http
  #     method: POST
  #     url: http://service.local/restart
  #     body: '{{ .result.summary }}'

  # Emit a new event back into the runtime (recursion is depth-capped):
  # then:
  #   action:
  #     type: emit
  #     event_type: incident.escalated

  # Delegate to an agent defined under `agents` below:
  # then:
  #   delegate:
  #     agent: triage
  #     prompt: |-
  #       Investigate this event and determine whether I need to act.

agents:
  # Generic HTTP agent: mrmr POSTs {event_id, decision, prompt}; 2xx = accepted.
  triage:
    endpoint: http://localhost:9000/tasks

default:
  ignore: true
  # Shadow mode: the outcome is decided and recorded but nothing executes —
  # how a new flow earns trust before going live:
  # default:
  #   shadow: true
